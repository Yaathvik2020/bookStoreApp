apiVersion: v1
kind: Service
metadata:
  name: mongodb-svc
  labels:
  {{- include "bookstor-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dbSvc.type }}
  selector:
    app: mongo
    {{- include "bookstor-helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.dbSvc.ports | toYaml | nindent 2 }}
