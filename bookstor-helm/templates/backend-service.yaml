apiVersion: v1
kind: Service
metadata:
  name: {{ include "bookstor-helm.fullname" . }}-backend-service
  labels:
  {{- include "bookstor-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backendService.type }}
  selector:
    app: backend
    {{- include "bookstor-helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.backendService.ports | toYaml | nindent 2 }}
