apiVersion: v1
kind: Service
metadata:
  name: {{ include "bookstor-helm.fullname" . }}-frontend-service
  labels:
  {{- include "bookstor-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontendService.type }}
  selector:
    app: frontend
    {{- include "bookstor-helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.frontendService.ports | toYaml | nindent 2 }}
